name: Dart CI

on: [push, pull_request]

jobs:
  test_and_validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for SonarCloud

      - name: Setup Dart OIDC
        # This step is not needed in the CI but we want to ensure that the publish flow will work so we include this here.
        # Set up the Dart SDK and provision the OIDC token used for publishing.
        # The `dart` command from this step will be shadowed by the one from the
        # Flutter SDK below. 
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260      

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.38.9"

      - name: Install dependencies
        run: |
          flutter pub get
          cd omise_flutter_module/
          flutter pub get

      - name: Analyze (Check if distributable for Dart)
        run: flutter analyze

      - name: Run Tests
        run: |
          flutter test --coverage
          ls -l coverage/lcov.info

      - name: Analyze (Check if distributable for Flutter)
        run: |
          cd example/
          flutter analyze

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
